name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go vet + go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./... -count=1
